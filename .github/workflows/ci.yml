name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@v22

      # same targets as `just check` locally (telem/shm needs a pi with pigpio)
      - name: build and test
        run: nix develop --command just check
