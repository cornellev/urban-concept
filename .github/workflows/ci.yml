name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # the build needs only tinyusb from pico-sdk's submodules
      - name: init tinyusb
        run: git -C vendor/pico-sdk submodule update --init lib/tinyusb

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: build firmware
        run: nix develop --command just elec build

  # build the way a student does, with the setup script and no nix
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            setup: ./setup/setup-macos.sh
          - os: ubuntu-latest
            setup: ./setup/setup-linux.sh
          - os: ubuntu-24.04-arm
            setup: ./setup/setup-linux.sh
          - os: windows-latest
            setup: powershell -ExecutionPolicy Bypass -File setup/setup-windows.ps1
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: elec
    steps:
      # no submodules here, because the setup script fetches them
      - uses: actions/checkout@v7

      - name: run setup script
        run: ${{ matrix.setup }}

      # doctor runs after the build because the build downloads the arm compiler and picotool
      - name: build firmware
        if: runner.os != 'Windows'
        run: just build && just doctor

      # winget writes PATH to the registry, which later steps don't reread
      - name: build firmware (windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH += ";" + [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          just build && just doctor

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # a virtual CAN interface for the socketcan tests
      - name: set up vcan0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r)
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 mtu 72
          sudo ip link set up vcan0

      - uses: DeterminateSystems/nix-installer-action@v22

      # fail instead of skipping if vcan0 is missing
      - name: test chuds
        run: nix develop --command just cev-lib chuds test
        env:
          CHUDS_REQUIRE_CAN: 1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: check formatting
        run: nix develop --command treefmt --ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: init tinyusb
        run: git -C vendor/pico-sdk submodule update --init lib/tinyusb

      - uses: DeterminateSystems/nix-installer-action@v22

      # the matcher turns each warning line into an annotation on the PR
      # warnings keep the check green, and a file that fails to parse fails it
      - name: lint
        run: |
          echo "::add-matcher::.github/clang-tidy.json"
          nix develop --command just elec lint
          nix develop --command just cev-lib chuds lint
