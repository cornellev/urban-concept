name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # the build needs only tinyusb from pico-sdk's submodules
      - name: init tinyusb
        run: git -C vendor/pico-sdk submodule update --init lib/tinyusb

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@v22

      # same targets as `just check` locally (telem/shm needs a pi with pigpio)
      - name: build and test
        run: nix develop --command just check
