name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # the build needs only tinyusb from pico-sdk's submodules
      - name: init tinyusb
        run: git -C vendor/pico-sdk submodule update --init lib/tinyusb

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: build firmware
        run: nix develop --command just elec build

      - name: build driver examples
        run: nix develop --command just cev-lib rp2040_mcp251863 build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # a virtual CAN interface for the socketcan tests
      - name: set up vcan0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-modules-extra-$(uname -r)
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 mtu 72
          sudo ip link set up vcan0

      - uses: DeterminateSystems/nix-installer-action@v22

      # fail instead of skipping if vcan0 is missing
      - name: test chuds
        run: nix develop --command just cev-lib chuds test
        env:
          CHUDS_REQUIRE_CAN: 1

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: check formatting
        run: nix develop --command just fmt-check

  no-heap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: init tinyusb
        run: git -C vendor/pico-sdk submodule update --init lib/tinyusb

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: audit firmware for heap use
        run: nix develop --command just elec audit-heap

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: init tinyusb
        run: git -C vendor/pico-sdk submodule update --init lib/tinyusb

      - uses: DeterminateSystems/nix-installer-action@v22

      # warnings show as annotations on the PR and keep the check green
      # a file that fails to parse still fails the check
      - name: lint
        run: |
          set -o pipefail
          { nix develop --command just elec lint && nix develop --command just cev-lib chuds lint; } 2>&1 | tee lint.log
          { grep ': warning: ' lint.log || true; } | sed -E "s|^$GITHUB_WORKSPACE/||; s|[^/]+/\.\./||g" | sort -u \
            | sed -nE 's|^([^:]+):([0-9]+):([0-9]+): warning: (.*)$|::warning file=\1,line=\2,col=\3::\4|p'
