name: setup

# runs the setup scripts on macos, linux, linux arm, and windows
# tests chuds on linux arm to verify pi can build with the same install
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/setup.yml
      - elec/setup/**
      - elec/cmake/**
      - elec/CMakeLists.txt
      - elec/justfile
      - vendor/pico-sdk
      - cev-lib/chuds/**
      - cev-lib/justfile
      - justfile
  pull_request:
    paths:
      - .github/workflows/setup.yml
      - elec/setup/**
      - elec/cmake/**
      - elec/CMakeLists.txt
      - elec/justfile
      - vendor/pico-sdk
      - cev-lib/chuds/**
      - cev-lib/justfile
      - justfile
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            setup: ./setup/setup-macos.sh
          - os: ubuntu-latest
            setup: ./setup/setup-linux.sh
          - os: ubuntu-24.04-arm
            setup: ./setup/setup-linux.sh
          - os: windows-latest
            setup: powershell -ExecutionPolicy Bypass -File setup/setup-windows.ps1
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: elec
    steps:
      # no submodules here, because the setup script fetches them
      - uses: actions/checkout@v7

      - name: run setup script
        run: ${{ matrix.setup }}

      # doctor runs after the build because the build downloads the arm compiler and picotool
      - name: build firmware (unix)
        if: runner.os != 'Windows'
        run: just build && just doctor

      # winget writes PATH to the registry, which later steps don't reread
      - name: build firmware (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH += ";" + [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          just build && just doctor

      # the pi builds chuds with the same apt tools
      - name: test chuds
        if: matrix.os == 'ubuntu-24.04-arm'
        working-directory: .
        run: just cev-lib chuds test
